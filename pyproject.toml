[project]
name = "ashare-alpha"
version = "0.1.0"
description = "A 股多因子选股研究框架：数据 → 因子 → 检验 → 模型 → 组合 → 回测"
requires-python = ">=3.11,<3.13"
dependencies = [
    "baostock>=0.8.9",
    "pandas>=2.2",
    "pyarrow>=15",
    "polars>=1.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "jupyterlab>=4.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
